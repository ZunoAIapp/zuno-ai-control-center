<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="ZUNO AI business control center">
<link rel="manifest" href="manifest.webmanifest">
<title>ZUNO AI — Control Center</title>
<style>
:root{--bg:#070b14;--panel:#0d1525;--panel2:#111e32;--line:#20324b;--text:#edf5ff;--muted:#9bb0ca;--cyan:#25d8f2;--blue:#087dff;--purple:#9655ff;--green:#3de0b1;--amber:#ffc66d;--red:#ff6f86;--radius:18px}
*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#142c55 0,transparent 40%),var(--bg);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1400px;margin:auto;padding:18px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#00cfff,#315cff 55%,#a34dff);display:grid;place-items:center;color:white;font-size:28px;font-weight:950;box-shadow:0 0 28px #087dff45}.brand h1{margin:0;font-size:22px;letter-spacing:2px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px;letter-spacing:2px}.topright{display:flex;align-items:center;gap:8px}.pill{font-size:12px;border:1px solid #24647a;background:#0b2938;color:#83edff;padding:8px 11px;border-radius:999px}.btn{border:1px solid var(--line);background:#132139;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:650}.btn.primary{border:0;background:linear-gradient(100deg,var(--blue),#674bff);box-shadow:0 5px 20px #087dff35}.btn.danger{border-color:#653042;background:#301724;color:#ffbdc8}.btn.small{padding:7px 9px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:20px}.nav{background:#0a1220;border:1px solid var(--line);border-radius:var(--radius);padding:10px;height:max-content;position:sticky;top:12px}.nav button{width:100%;display:flex;gap:11px;align-items:center;border:0;background:transparent;color:var(--muted);padding:13px 12px;border-radius:12px;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#142947;color:white}.nav .ico{width:22px;text-align:center}.navnote{margin:20px 8px 8px;padding-top:15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}.viewhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 18px}.viewhead h2{font-size:25px;margin:0 0 6px}.viewhead p{color:var(--muted);margin:0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.card{background:linear-gradient(150deg,#101b2d,#0b1321);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;margin:10px 0 5px;letter-spacing:-.5px}.stat small{color:var(--muted)}.accent{color:var(--cyan)}.sectiongrid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.card h3{margin:0 0 14px;font-size:16px}.card p.sub{margin:-7px 0 14px;color:var(--muted);font-size:12px}.progress{height:8px;background:#1c2b41;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:9px}.muted{color:var(--muted)}.list{display:grid;gap:9px}.item{border:1px solid var(--line);background:#0b1422;border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item strong{display:block;font-size:13px}.item small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:4px 7px;color:var(--muted);white-space:nowrap}.tag.pending{border-color:#71552d;color:#ffd58a;background:#322613}.tag.good{border-color:#1b6959;color:#7df3d1;background:#0e2b29}.tag.bad{border-color:#6b3342;color:#ffb0bf;background:#301722}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:720px;background:#0b1321}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}th{background:#12243d;color:#bcecff;font-size:11px;text-transform:uppercase;letter-spacing:.6px}td{color:#dce9fa}tr:last-child td{border-bottom:0}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #29415f;border-radius:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#08111e;border:1px solid #263a55;color:var(--text);border-radius:10px;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{background:#091322;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px;min-width:180px}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#0d1727;border:1px solid #29415f;border-radius:20px;padding:20px;box-shadow:0 20px 80px #0008}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.modalclose{font-size:23px;background:none;border:0;color:var(--muted)}.notice{padding:12px;border:1px solid #5b4a27;background:#261f12;color:#ffe0a3;border-radius:12px;font-size:12px;line-height:1.5}.successnotice{padding:12px;border:1px solid #1e6657;background:#0d2825;color:#9bf5d7;border-radius:12px;font-size:12px;line-height:1.5}.mobilebar{display:none}.hidden{display:none!important}.footer{color:#647b99;font-size:11px;margin-top:20px;line-height:1.6}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#122b42;border:1px solid #2e607c;padding:12px 16px;border-radius:12px;display:none;z-index:20;font-size:13px;max-width:90vw}.toast.show{display:block}
@media(max-width:850px){.app{padding:12px 12px 90px}.layout{display:block}.nav{display:none}.mobilebar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#07111ff2;border-top:1px solid var(--line);backdrop-filter:blur(15px);z-index:5}.mobilebar button{background:transparent;border:0;color:var(--muted);font-size:10px;display:grid;gap:4px;justify-items:center;padding:6px 8px}.mobilebar button.active{color:var(--cyan)}.mobilebar span{font-size:19px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.sectiongrid{grid-template-columns:1fr}.top{padding-bottom:15px}.brand h1{font-size:18px}.brand p{font-size:9px}.mark{width:42px;height:42px}.topright .pill{display:none}.viewhead h2{font-size:22px}.formgrid{grid-template-columns:1fr}.viewhead{align-items:center}.viewhead .btn{font-size:12px;padding:9px}.stat label{font-size:11px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark">Z</div><div><h1>ZUNO AI</h1><p>WORK SMARTER. WIN MORE.</p></div></div>
    <div class="topright"><span class="pill">OWNER CONTROL ENABLED</span><button class="btn small" id="exportBtn">Export data</button></div>
  </header>
  <div class="layout">
    <nav class="nav" id="sideNav">
      <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
      <button data-page="leads"><span class="ico">♧</span>Sales leads</button>
      <button data-page="clients"><span class="ico">▣</span>Clients</button>
      <button data-page="approvals"><span class="ico">✓</span>Approval queue <span id="approvalCount" class="tag pending">0</span></button>
      <button data-page="automation"><span class="ico">⚙</span>Automation</button>
      <button data-page="reports"><span class="ico">▤</span>Reports</button>
      <div class="navnote">AI can prepare work. You approve external actions, spending, and important decisions.</div>
    </nav>
    <main id="main"></main>
  </div>
</div>
<nav class="mobilebar" id="mobileNav">
  <button class="active" data-page="dashboard"><span>▦</span>Home</button>
  <button data-page="leads"><span>♧</span>Leads</button>
  <button data-page="clients"><span>▣</span>Clients</button>
  <button data-page="approvals"><span>✓</span>Approvals</button>
  <button data-page="automation"><span>⚙</span>Automate</button>
</nav>
<div class="modalback" id="modalBack"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Add record</h3><button class="modalclose" id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='zuno-ai-v1';
const initial={leads:[],clients:[],approvals:[],activities:[],settings:{goal:10000,ownerApproval:true},tasks:[
{id:'task1',name:'Review new leads',description:'Check newly added prospects and decide whether to prepare outreach.',enabled:true,frequency:'Daily',status:'Ready'},
{id:'task2',name:'Follow-up reminders',description:'Flag leads whose next follow-up date is due. Does not send messages.',enabled:true,frequency:'Daily',status:'Ready'},
{id:'task3',name:'Weekly business report',description:'Prepare a summary from records entered in this app.',enabled:true,frequency:'Weekly',status:'Ready'}
]};
let state=loadState(), page='dashboard';
function loadState(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateApprovalCount();}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}
function id(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase().slice(-6)}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function updateApprovalCount(){const n=state.approvals.filter(a=>a.status==='Pending').length;document.getElementById('approvalCount').textContent=n;}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zuno-ai-backup.json';a.click();URL.revokeObjectURL(a.href);};
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openModal(title,html,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.getElementById('modalBody').querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f).entries());onSave(data);closeModal();render();});}
function field(label,name,placeholder='',type='text',required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></div>`}
function selectField(label,name,opts){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`}
function addLead(){openModal('Add sales lead',`<form><div class="formgrid">${field('Business name','business','Example: Bright Home Cleaning', 'text',true)}${field('Contact name','contact','Owner or manager')}${field('Business type','type','Cleaning, landscaping, etc.','text',true)}${field('Business email','email','name@business.com','email')}${field('Phone','phone','Optional','tel')}${field('Website','website','https://')}${selectField('Status','status',['New','Contacted','Interested','Demo Scheduled','Proposal Sent','Won','Lost'])}${field('Next follow-up date','followup','','date')}${field('Monthly price offered ($)','price','250','number')}${field('Notes','notes','How we found this prospect')}</div><div class="notice" style="margin-top:12px">Adding a lead does not contact them. Messages must be drafted and approved separately.</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save lead</button></div></form>`,d=>{state.leads.push({id:id('ZL'),business:d.business,contact:d.contact,type:d.type,email:d.email,phone:d.phone,website:d.website,status:d.status,followup:d.followup,price:Number(d.price)||0,notes:d.notes,created:new Date().toISOString(),lastContacted:'',outcome:''});log('Lead added',d.business);save();toast('Lead saved. No message was sent.');});}
function addClient(){openModal('Add client',`<form><div class="formgrid">${field('Business name','business','Client business', 'text',true)}${field('Owner / contact','contact','Name')}${field('Email','email','owner@business.com','email')}${selectField('Plan','plan',['Founding — $250/mo','Growth — $500/mo','Pro — $750/mo','Custom'])}${field('Monthly fee ($)','fee','250','number',true)}${field('Start date','start','','date')}${selectField('Status','status',['Onboarding','Active','Paused','Cancelled'])}${field('Notes','notes','Scope, agreed terms')}</div><div class="notice" style="margin-top:12px">Only mark a client Active after they have agreed to the service terms. This does not charge them.</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save client</button></div></form>`,d=>{state.clients.push({id:id('ZC'),business:d.business,contact:d.contact,email:d.email,plan:d.plan,fee:Number(d.fee)||0,start:d.start,status:d.status,notes:d.notes});log('Client record added',d.business);save();toast('Client record saved. No payment was taken.');});}
function log(action,detail){state.activities.unshift({id:id('EV'),date:new Date().toISOString(),action,detail});}
function requestApproval(type,title,details,payload={}){state.approvals.unshift({id:id('AP'),type,title,details,payload,status:'Pending',created:new Date().toISOString()});log('Approval requested',title);save();toast('Added to approval queue. Nothing was sent or purchased.');render();}
function approve(idv){const a=state.approvals.find(x=>x.id===idv);if(!a)return;if(a.type==='message'){a.status='Approved';a.note='Approved locally. No message delivery integration is connected.';toast('Marked approved. No message was sent.');}else if(a.type==='spend'){a.status='Approved';a.note='Approved locally. No payment integration is connected.';toast('Marked approved. No money was spent.');}else{a.status='Approved';a.note='Approved locally; external execution is not connected.';toast('Marked approved. No external action was executed.');}log('Approval marked',a.title);save();render();}
function reject(idv){const a=state.approvals.find(x=>x.id===idv);if(a){a.status='Rejected';log('Approval rejected',a.title);save();render();toast('Request rejected.');}}
function draftMessage(leadId){const l=state.leads.find(x=>x.id===leadId);if(!l)return;const body=`Hi ${l.contact||'there'}, I'm reaching out from ZUNO AI. We help ${l.type||'service businesses'} organize new inquiries and follow-ups so fewer opportunities slip through the cracks. Would you be open to a brief look at a demo?`;requestApproval('message','Review outreach: '+l.business,body,{leadId,body});}
function stat(label,value,sub=''){return `<div class="stat"><label>${label}</label><strong>${value}</strong><small>${sub}</small></div>`}
function empty(text){return `<div class="empty">${text}</div>`}
function viewHead(title,desc,button=''){return `<div class="viewhead"><div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function render(){const m=document.getElementById('main');if(page==='dashboard')m.innerHTML=dashboard();if(page==='leads')m.innerHTML=leadsPage();if(page==='clients')m.innerHTML=clientsPage();if(page==='approvals')m.innerHTML=approvalsPage();if(page==='automation')m.innerHTML=automationPage();if(page==='reports')m.innerHTML=reportsPage();bindActions();}
function dashboard(){const active=state.clients.filter(c=>c.status==='Active'),mrr=active.reduce((s,c)=>s+(+c.fee||0),0),won=state.leads.filter(l=>l.status==='Won').length,pending=state.approvals.filter(a=>a.status==='Pending').length,progress=Math.min(100,mrr/(+state.settings.goal||10000)*100),due=state.leads.filter(l=>l.followup&&l.followup<=new Date().toISOString().slice(0,10)&&!['Won','Lost'].includes(l.status));return `${viewHead('Business dashboard','Your business at a glance. External actions remain approval-gated.','<button class="btn primary" data-action="add-lead">+ Add lead</button>')}<div class="stats">${stat('Sales prospects',state.leads.length,'In your pipeline')}${stat('Active clients',active.length,'Paying customers')}${stat('Monthly recurring revenue',money(mrr),'Revenue, not profit')}${stat('Pending approvals',pending,'Require your review')}</div><div class="sectiongrid"><div class="card"><h3>Revenue target</h3><p class="sub">Goal: ${money(state.settings.goal)} in monthly recurring revenue</p><strong style="font-size:28px">${money(mrr)}</strong><div class="progress"><span style="width:${progress}%"></span></div><div class="muted" style="font-size:12px">${progress.toFixed(1)}% of target · ${money(Math.max(0,state.settings.goal-mrr))} remaining</div><div style="margin-top:18px" class="toolbar"><button class="btn" data-page="leads">Manage leads</button><button class="btn" data-page="clients">Manage clients</button></div></div><div class="card"><h3>Needs attention</h3>${due.length?`<p class="sub">${due.length} follow-up(s) due</p>`: `<p class="muted">No follow-ups currently overdue in your records.</p>`}${pending?`<p><span class="tag pending">${pending} pending approvals</span></p>`:''}<button class="btn" data-page="approvals">Review approval queue</button><p class="footer">This prototype does not send messages, charge customers, or run background jobs.</p></div></div><div class="card" style="margin-top:14px"><h3>Recent activity</h3>${state.activities.length?`<div class="list">${state.activities.slice(0,5).map(a=>`<div class="item"><div><strong>${esc(a.action)}</strong><small>${esc(a.detail||'')}</small></div><span class="tag">${new Date(a.date).toLocaleDateString()}</span></div>`).join('')}</div>`:empty('Your activity will appear here as you use ZUNO AI.')}</div>`}
function leadsPage(){return `${viewHead('Sales leads','Track prospects and prepare outreach. ZUNO AI never sends messages from this prototype.','<button class="btn primary" data-action="add-lead">+ Add lead</button>')}<div class="toolbar"><input id="leadSearch" placeholder="Search leads..." aria-label="Search leads"><button class="btn" data-action="export-leads">Export leads CSV</button></div><div id="leadTable">${leadTable(state.leads)}</div>`}
function leadTable(arr){if(!arr.length)return empty('No leads yet. Add your first business prospect to begin.');return `<div class="tablewrap"><table><thead><tr><th>Business</th><th>Type</th><th>Status</th><th>Monthly offer</th><th>Follow-up</th><th>Actions</th></tr></thead><tbody>${arr.map(l=>`<tr><td><strong>${esc(l.business)}</strong><br><span class="muted">${esc(l.contact||'No contact yet')}</span></td><td>${esc(l.type)}</td><td><select data-status="${l.id}" aria-label="Lead status">${['New','Contacted','Interested','Demo Scheduled','Proposal Sent','Won','Lost'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${money(l.price)}</td><td>${esc(l.followup||'—')}</td><td><button class="btn small" data-action="draft" data-id="${l.id}">Draft outreach</button></td></tr>`).join('')}</tbody></table></div>`}
function clientsPage(){return `${viewHead('Clients','Manage client records and recurring revenue. Only verified paying clients count toward MRR.','<button class="btn primary" data-action="add-client">+ Add client</button>')}${state.clients.length?`<div class="tablewrap"><table><thead><tr><th>Business</th><th>Plan</th><th>Monthly fee</th><th>Status</th><th>Notes</th></tr></thead><tbody>${state.clients.map(c=>`<tr><td><strong>${esc(c.business)}</strong><br><span class="muted">${esc(c.contact||'')}</span></td><td>${esc(c.plan)}</td><td>${money(c.fee)}</td><td><select data-client-status="${c.id}">${['Onboarding','Active','Paused','Cancelled'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(c.notes||'')}</td></tr>`).join('')}</tbody></table></div>`:empty('No clients yet. Add a client only after you have agreed on scope and terms.')}`}
function approvalsPage(){const pending=state.approvals.filter(a=>a.status==='Pending'),done=state.approvals.filter(a=>a.status!=='Pending');return `${viewHead('Approval queue','Review proposed actions before anything external happens.','')}<div class="notice">Approval in this prototype records your decision only. No email, message, purchase, payment, or external action is connected.</div><h3 style="margin-top:20px">Waiting for your decision (${pending.length})</h3>${pending.length?`<div class="list">${pending.map(a=>`<div class="item"><div style="flex:1"><strong>${esc(a.title)}</strong><small>${esc(a.details)}</small><small>Requested ${new Date(a.created).toLocaleString()}</small><span class="tag pending">${esc(a.type)}</span></div><div class="toolbar"><button class="btn small primary" data-action="approve" data-id="${a.id}">Approve</button><button class="btn small danger" data-action="reject" data-id="${a.id}">Reject</button></div></div>`).join('')}</div>`:empty('Nothing is waiting for approval.')}${done.length?`<h3 style="margin-top:22px">History</h3><div class="list">${done.slice(0,15).map(a=>`<div class="item"><div><strong>${esc(a.title)}</strong><small>${esc(a.note||a.details)}</small></div><span class="tag ${a.status==='Approved'?'good':'bad'}">${a.status}</span></div>`).join('')}</div>`:''}`}
function automationPage(){return `${viewHead('Automation center','Manage proposed automations. In this prototype these are plans, not running background jobs.','')}<div class="notice">No background scheduler or connected integrations are active yet. Toggles below save your preferences only. We will connect triggers after deploying a backend.</div><div class="list" style="margin-top:14px">${state.tasks.map(t=>`<div class="item"><div style="flex:1"><strong>${esc(t.name)}</strong><small>${esc(t.description)}</small><small>Frequency: ${esc(t.frequency)} · Status: ${t.enabled?'Enabled preference':'Paused preference'}</small></div><button class="btn small" data-action="toggle-task" data-id="${t.id}">${t.enabled?'Pause':'Enable'}</button></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Owner controls</h3><div class="successnotice">Required approval is enabled for external messages, spending, and important decisions.</div><div class="field" style="margin-top:12px"><label>Monthly revenue target ($)</label><input id="goalInput" type="number" min="0" value="${Number(state.settings.goal)||10000}"></div><button class="btn primary" style="margin-top:10px" data-action="save-goal">Save target</button></div>`}
function reportsPage(){const mrr=state.clients.filter(c=>c.status==='Active').reduce((s,c)=>s+(+c.fee||0),0);return `${viewHead('Reports','A simple, verifiable snapshot of your current records.','<button class="btn" data-action="export-data">Export backup</button>')}<div class="stats">${stat('Total prospects',state.leads.length)}${stat('Leads won',state.leads.filter(l=>l.status==='Won').length)}${stat('Active clients',state.clients.filter(c=>c.status==='Active').length)}${stat('Current MRR',money(mrr))}</div><div class="card" style="margin-top:14px"><h3>Weekly review checklist</h3><div class="list">${['Review new prospects and replies','Check follow-ups due and honor opt-outs','Confirm new clients and subscription status','Review pending approvals and failures','Record verified outcomes and expenses'].map(x=>`<div class="item"><span>${x}</span><span class="tag">Manual review</span></div>`).join('')}</div></div>`}
function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action,idv=b.dataset.id;if(a==='add-lead')addLead();if(a==='add-client')addClient();if(a==='draft')draftMessage(idv);if(a==='approve')approve(idv);if(a==='reject')reject(idv);if(a==='toggle-task'){const t=state.tasks.find(t=>t.id===idv);t.enabled=!t.enabled;save();render();}if(a==='save-goal'){const n=Number(document.getElementById('goalInput').value);if(n<0||!Number.isFinite(n)){toast('Enter a valid target');return;}state.settings.goal=n;save();render();toast('Revenue target saved');}if(a==='export-data')document.getElementById('exportBtn').click();if(a==='export-leads'){const rows=[['Business','Contact','Type','Email','Phone','Website','Status','Follow-up','Monthly offer','Notes'],...state.leads.map(l=>[l.business,l.contact,l.type,l.email,l.phone,l.website,l.status,l.followup,l.price,l.notes])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n');download('zuno-leads.csv',csv,'text/csv');}}));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{const l=state.leads.find(x=>x.id===s.dataset.status);if(l){l.status=s.value;log('Lead status changed',l.business+' → '+s.value);save();render();}});document.querySelectorAll('[data-client-status]').forEach(s=>s.onchange=()=>{const c=state.clients.find(x=>x.id===s.dataset.clientStatus);if(c){c.status=s.value;log('Client status changed',c.business+' → '+s.value);save();render();}});const search=document.getElementById('leadSearch');if(search)search.oninput=()=>{const q=search.value.toLowerCase();document.getElementById('leadTable').innerHTML=leadTable(state.leads.filter(l=>[l.business,l.contact,l.type,l.status].join(' ').toLowerCase().includes(q)));bindActions();};}
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();updateApprovalCount();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
